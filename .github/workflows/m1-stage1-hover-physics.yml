name: M1 stage-1 XV-15 hover physics

on:
  push:
    branches:
      - research/m1-xv15-physics-enhanced-20260828
    paths:
      - '.github/workflows/m1-stage1-hover-physics.yml'
      - 'analysis/**'
      - 'model/**'
      - 'params_nominal.m'
      - 'M1_RESEARCH_CHARTER.md'
      - 'CODEX_TASK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-stage1-hover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2021a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a

      - name: Run M0 and M1 stage-1 physics ladder
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            artifactRoot = fullfile(pwd,'ci_artifacts','m1_stage1_hover_physics');
            if ~exist(artifactRoot,'dir'), mkdir(artifactRoot); end;
            results = run_m1_stage1_hover_physics(artifactRoot);
            fid = fopen(fullfile(artifactRoot,'M1_STAGE1_EXECUTION_STATUS.txt'),'w');
            fprintf(fid,'status=EXECUTED\nclaimBoundary=%s\n',results.claimBoundary);
            fclose(fid);

      - name: Upload M1 stage-1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-stage1-hover-physics-evidence
          path: ci_artifacts/m1_stage1_hover_physics
          if-no-files-found: error
