name: M1 stage-3 XV-15 Corrigan stall delay

on:
  push:
    branches:
      - research/m1-xv15-physics-enhanced-20260828
    paths:
      - '.github/workflows/m1-stage3-corrigan-stall-delay.yml'
      - 'analysis/xv15_c81_corrigan_stall_delay.m'
      - 'analysis/run_m1_stage3_corrigan_stall_delay.m'
      - 'analysis/xv15_c81_section_lookup.m'
      - 'analysis/run_xv15_actual_geometry_c81_crosscheck.m'
      - 'docs/M1_STAGE3_SOURCE_AUDIT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-stage3-corrigan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2021a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a

      - name: Run predeclared Corrigan variants
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            root = pwd;
            artifactRoot = fullfile(root,'ci_artifacts','m1_stage3_corrigan_stall_delay');
            if ~exist(artifactRoot,'dir'), mkdir(artifactRoot); end;
            results = run_m1_stage3_corrigan_stall_delay(artifactRoot);
            fid = fopen(fullfile(artifactRoot,'M1_STAGE3_CORRIGAN_STATUS.txt'),'w');
            fprintf(fid,'status=EXECUTED\nclaimBoundary=%s\n',results.claimBoundary);
            fprintf(fid,'m1bConsistencyCT_pp=%.12g\nm1bConsistencyCP_pp=%.12g\nm1bConsistencyFM_pp=%.12g\n',results.m1bConsistency_pp(1),results.m1bConsistency_pp(2),results.m1bConsistency_pp(3));
            fclose(fid);

      - name: Upload M1 stage-3 Corrigan evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-stage3-corrigan-stall-delay-evidence
          path: ci_artifacts/m1_stage3_corrigan_stall_delay
          if-no-files-found: error
