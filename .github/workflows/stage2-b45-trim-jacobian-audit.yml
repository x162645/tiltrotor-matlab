name: Stage 2 B45 trim Jacobian audit

on:
  push:
    branches:
      - research/stage2-aircraft-m0-m1-propagation-20260830
    paths:
      - 'analysis/stage2_aircraft/stage2_trim_definition_jacobian.m'
      - 'analysis/stage2_aircraft/run_stage2_b45_trim_jacobian_audit.m'
      - '.github/workflows/stage2-b45-trim-jacobian-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b45-jacobian-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Run exact-DOF B45 Jacobian audit
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            outDir=fullfile(pwd,'ci_artifacts','stage2_b45_trim_jacobian_audit');
            results=run_stage2_b45_trim_jacobian_audit(outDir);
            s=results.summary;
            fprintf('STAGE2_B45_JACOBIAN|base_res=%.12g|rank=%d|cond=%.12g|alpha_bound=%.12g|best_line_res=%.12g|best_alpha=%.12g|class=%s\n',s.baseResidualNormRaw(2),s.rankScaled(2),s.conditionScaled(2),s.alphaToFirstBound(2),s.bestSupportedLineSearchRawResidual(2),s.bestSupportedLineSearchAlpha(2),s.classification{2});
      - name: Upload B45 Jacobian evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-b45-trim-jacobian-audit
          path: ci_artifacts/stage2_b45_trim_jacobian_audit/
          if-no-files-found: error
