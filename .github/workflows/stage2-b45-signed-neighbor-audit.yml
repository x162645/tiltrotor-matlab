name: Stage 2 B45 signed-neighbor support audit

on:
  push:
    branches:
      - research/stage2-aircraft-m0-m1-propagation-20260830
    paths:
      - 'analysis/stage2_aircraft/run_stage2_b45_signed_neighbor_audit.m'
      - '.github/workflows/stage2-b45-signed-neighbor-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b45-signed-neighbor-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Run signed-neighbor B45 local-support audit
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            outDir=fullfile(pwd,'ci_artifacts','stage2_b45_signed_neighbor_audit');
            results=run_stage2_b45_signed_neighbor_audit(outDir);
            s=results.summary;
            for k=1:height(s), fprintf('STAGE2_B45_SIGNED_NEIGHBOR|frac=%.12g|returned=%d|supported=%d|flap_fail=%d|other_error=%d|all_six=%d\n',s.stepFraction(k),s.returnedCount(k),s.physicalSupportedCount(k),s.flapNotConvergedCount(k),s.otherErrorCount(k),s.allSixSupported(k)); end;
      - name: Upload B45 signed-neighbor evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-b45-signed-neighbor-audit
          path: ci_artifacts/stage2_b45_signed_neighbor_audit/
          if-no-files-found: error
