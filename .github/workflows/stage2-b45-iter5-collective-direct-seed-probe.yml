name: Stage 2 B45 iter5 direct-seed collective probe
on:
  push:
    branches:
      - research/stage2-aircraft-m0-m1-propagation-20260830
    paths:
      - 'analysis/stage2_aircraft/run_stage2_b45_iter5_collective_direct_seed_probe.m'
      - '.github/workflows/stage2-b45-iter5-collective-direct-seed-probe.yml'
  workflow_dispatch:
jobs:
  b45-iter5-direct-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Run B45 iter5 direct-seed collective probe
        uses: matlab-actions/run-command@v3
        with:
          command: startup; addpath(fullfile(pwd,'analysis','stage2_aircraft')); outDir=fullfile(pwd,'ci_artifacts','stage2_b45_iter5_direct_seed'); results=run_stage2_b45_iter5_collective_direct_seed_probe(outDir);
      - name: Upload B45 iter5 direct-seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-b45-iter5-collective-direct-seed-probe
          path: ci_artifacts/stage2_b45_iter5_direct_seed/
          if-no-files-found: error
