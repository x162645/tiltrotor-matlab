name: M1 stage-3 XV-15 inboard high-alpha audit

on:
  push:
    branches:
      - research/m1-xv15-physics-enhanced-20260828
    paths:
      - '.github/workflows/m1-stage3-inboard-high-alpha-audit.yml'
      - 'analysis/run_m1_stage3_inboard_high_alpha_audit.m'
      - 'analysis/xv15_c81_section_lookup.m'
      - 'CODEX_TASK.md'
      - 'M1_RESEARCH_CHARTER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-stage3-high-alpha-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2021a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a

      - name: Audit M1-B local section states
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            root = pwd;
            artifactRoot = fullfile(root,'ci_artifacts','m1_stage3_inboard_high_alpha_audit');
            if ~exist(artifactRoot,'dir'), mkdir(artifactRoot); end;
            results = run_m1_stage3_inboard_high_alpha_audit(artifactRoot);
            fid = fopen(fullfile(artifactRoot,'M1_STAGE3_AUDIT_STATUS.txt'),'w');
            fprintf(fid,'status=EXECUTED\nclaimBoundary=%s\n',results.claimBoundary);
            fclose(fid);

      - name: Upload M1 stage-3 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-stage3-inboard-high-alpha-audit-evidence
          path: ci_artifacts/m1_stage3_inboard_high_alpha_audit
          if-no-files-found: error
