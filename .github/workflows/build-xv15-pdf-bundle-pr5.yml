name: Build final XV-15 PDF bundle

on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/full-wing-model-autonomous-20260702
          path: source
      - name: Assemble verified local sources and fetch CR-114614
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp source/references/wing_full_angle/NASA_TM_88373.pdf bundle/NASA_TM_88373_Near_Vertical_Wing_Flap_Aerodynamics.pdf
          cp source/references/wing_full_angle/NASA_CR_176970.pdf bundle/NASA_CR_176970_XV15_Rotor_Wing_Download.pdf
          cp source/references/wing_full_angle/naca_geometry/NASA_TM_X_3069.pdf bundle/NASA_TM_X_3069_NACA_6_6A_Ordinates_Program.pdf
          cp source/references/wing_full_angle/naca_geometry/NASA_TM_4741.pdf bundle/NASA_TM_4741_NACA_Airfoil_Ordinates_Program.pdf
          cp source/references/wing_full_angle/naca_geometry/NACA_TR_903.pdf bundle/NACA_TR_903_6A_Series_Data.pdf
          cp source/references/wing_full_angle/naca_geometry/NASA_TR_R_84.pdf bundle/NASA_TR_R_84_NACA_Airfoil_Ordinates.pdf
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import requests
          target=Path('bundle/NASA_CR_114614_Bell_Model_301_Mathematical_Model.pdf')
          raw='https://ntrs.nasa.gov/api/citations/19730022217/downloads/19730022217.pdf'
          urls=[
            raw,
            'https://ntrs.nasa.gov/archive/nasa/casi.ntrs.nasa.gov/19730022217.pdf',
            'https://api.allorigins.win/raw?url='+quote(raw,safe=''),
            'https://corsproxy.io/?url='+quote(raw,safe=''),
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          errors=[]
          for u in urls:
            try:
              r=s.get(u,timeout=180,allow_redirects=True)
              data=r.content
              print(u, r.status_code, r.headers.get('content-type'), len(data), data[:16])
              if r.status_code==200 and data.startswith(b'%PDF-') and len(data)>100000:
                target.write_bytes(data); break
              errors.append(f'{u}: HTTP {r.status_code}, {len(data)} bytes, {data[:40]!r}')
            except Exception as e:
              errors.append(f'{u}: {e!r}')
          if not target.exists():
            raise SystemExit('\n'.join(errors))
          PY
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null
          printf 'filename,pages,size_bytes,sha256\n' > bundle/MANIFEST.csv
          for f in bundle/*.pdf; do
            [ "$(head -c 5 "$f")" = '%PDF-' ]
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            size=$(stat -c %s "$f")
            sha=$(sha256sum "$f" | awk '{print toupper($1)}')
            printf '%s,%s,%s,%s\n' "$(basename "$f")" "$pages" "$size" "$sha" >> bundle/MANIFEST.csv
          done
          cat > bundle/README.txt <<'EOF'
          XV-15 full-angle wing-model reference PDFs.
          Core sources: NASA CR-114614, NASA TM-X-3069, NASA TM-4741,
          NACA TR-903, NASA TR R-84, NASA TM-88373 and NASA CR-176970.
          Verify SHA256 values against MANIFEST.csv after copying.
          EOF
          cat bundle/MANIFEST.csv
      - uses: actions/upload-artifact@v4
        with:
          name: XV15_full_angle_wing_reference_PDFs_FINAL
          path: bundle/
          if-no-files-found: error
          retention-days: 7
