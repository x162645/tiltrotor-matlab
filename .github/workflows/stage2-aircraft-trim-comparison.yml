name: Stage 2 aircraft M0 M1 trim comparison

on:
  push:
    branches:
      - research/stage2-aircraft-m0-m1-propagation-20260830
    paths:
      - '.github/workflows/stage2-aircraft-trim-comparison.yml'
      - 'analysis/stage2_aircraft/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aircraft-trim-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Run six primary M0/M1 aircraft trims
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            root=fullfile(pwd,'ci_artifacts','stage2_aircraft_trim');
            if ~exist(root,'dir'), mkdir(root); end;
            results=run_stage2_trim_comparison(root);
            disp(results.summary);
            assert(height(results.points)==6);
            assert(height(results.deltas)==3);
      - name: Upload stage-2 trim evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-aircraft-m0-m1-trim
          path: ci_artifacts/stage2_aircraft_trim/
          if-no-files-found: error
