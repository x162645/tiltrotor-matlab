name: M1 Stage3B Large-Angle Local Closure

on:
  push:
    branches:
      - research/m1-large-angle-local-closure-20260902
  workflow_dispatch:

jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2021a
      - name: Run Stage3B large-angle local closure diagnostic
        uses: matlab-actions/run-command@v2
        with:
          command: startup; results = run_m1_stage3b_large_angle_local_closure; disp(results.metrics);
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-stage3b-large-angle-local
          path: results/m1_stage3b_large_angle_local_closure/**
          if-no-files-found: error
