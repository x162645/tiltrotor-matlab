name: Stage 2 B45 branch-tracked linearization audit
on:
  push:
    branches:
      - research/stage2-aircraft-m0-m1-propagation-20260830
    paths:
      - 'analysis/stage2_aircraft/run_stage2_b45_branch_tracked_linearization_audit.m'
      - 'analysis/stage2_aircraft/stage2_trim_longitudinal.m'
      - 'analysis/stage2_aircraft/stage2_tiltrotor_eom.m'
      - 'analysis/stage2_aircraft/stage2_total_forces_moments.m'
      - 'analysis/stage2_aircraft/run_stage2_b45_adaptive_path_trim_audit.m'
      - 'analysis/stage2_aircraft/run_stage2_b45_adaptive_path_trim_extension_audit.m'
      - '.github/workflows/stage2-b45-branch-tracked-linearization-audit.yml'
  workflow_dispatch:
jobs:
  b45-branch-tracked-linearization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Run B45 branch-tracked fixed-endpoint linearization audit
        uses: matlab-actions/run-command@v3
        with:
          command: startup; addpath(fullfile(pwd,'analysis','stage2_aircraft')); outDir=fullfile(pwd,'ci_artifacts','stage2_b45_branch_tracked_linearization'); results=run_stage2_b45_branch_tracked_linearization_audit(outDir);
      - name: Upload B45 branch-tracked linearization evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-b45-branch-tracked-linearization-audit
          path: ci_artifacts/stage2_b45_branch_tracked_linearization/
          if-no-files-found: error
