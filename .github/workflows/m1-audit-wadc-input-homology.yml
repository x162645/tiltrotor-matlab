name: M1 audit WADC input homology

on:
  push:
    branches:
      - research/m1-xv15-physics-enhanced-20260828
    paths:
      - '.github/workflows/m1-audit-wadc-input-homology.yml'
      - 'analysis/run_m1_wadc_input_homology_sensitivity.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wadc-input-homology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Run WADC post-hoc input-homology sensitivity
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            root = fullfile(pwd,'ci_artifacts','m1_wadc_input_homology_sensitivity');
            if ~exist(root,'dir'), mkdir(root); end;
            results = run_m1_wadc_input_homology_sensitivity(root);
            disp(results.metrics);
            disp(results.soundAudit);
            disp(results.identityDiff);
            assert(results.identityDiff <= 1e-10);
            assert(all(results.points.physicalConverged));
      - name: Upload WADC input-homology evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-audit-wadc-input-homology
          path: ci_artifacts/m1_wadc_input_homology_sensitivity/
          if-no-files-found: error
